<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>SFL Rules — Southwest Football League</title>
<meta name="description" content="Look up SFL football rules, ask questions, and suggest new rules." />
<script src="https://cdn.tailwindcss.com"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
<script>
  if (window.tailwind) tailwind.config = {
    theme: {
      extend: {
        colors: {
          /* SFL brand — swap these hex values for the league's exact colors */
          navy:  { DEFAULT: "#0B2A4A", 700: "#0f335a", 800: "#0a2340", 900: "#071a30" },
          brand: { DEFAULT: "#C8102E", dark: "#a30d26" },   /* red */
          gold:  { DEFAULT: "#F5A623", dark: "#d98c0f" },
        },
        fontFamily: {
          head: ['Oswald', 'system-ui', 'sans-serif'],
          body: ['Inter', 'system-ui', 'sans-serif'],
        },
      },
    },
  };
</script>
<style>
  :root { --navy:#0B2A4A; --brand:#C8102E; --gold:#F5A623; }
  /* Ensure the [hidden] attribute always wins over Tailwind display utilities
     (e.g. .flex on the entry overlay) so panels/overlays hide reliably. */
  [hidden] { display: none !important; }
  body { font-family: 'Inter', system-ui, sans-serif; }
  h1,h2,h3,.font-head { font-family:'Oswald',system-ui,sans-serif; letter-spacing:.02em; }
  .rule-body { white-space: pre-wrap; overflow-wrap:anywhere; }
  .tab-underline { box-shadow: inset 0 -3px 0 0 var(--brand); }
  mark { background: #ffe39b; color:inherit; padding:0 1px; border-radius:2px; }
  /* Accordion chevrons — scoped with > so nested (section) chevrons don't rotate with the category */
  details.acc > summary { list-style:none; }
  details.acc > summary::-webkit-details-marker { display:none; }
  .chev { transition: transform .2s; }
  details.acc[open] > summary .chev { transform: rotate(180deg); }
  #scrollHint { transition: opacity .25s; }
  #suggestDivChev { transition: transform .2s; }
  .chat-scroll::-webkit-scrollbar{width:8px} .chat-scroll::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:8px}
  .fade-in { animation: fade .25s ease both; } @keyframes fade { from{opacity:0;transform:translateY(4px)} to{opacity:1} }
</style>
</head>
<body class="bg-slate-100 text-navy-900 min-h-screen flex flex-col">

<!-- ================= HEADER ================= -->
<header class="bg-navy-800 text-white shadow-lg sticky top-0 z-30">
  <div class="max-w-5xl mx-auto px-4 h-12 flex items-center gap-3">
    <div class="font-head text-lg font-bold tracking-wide leading-none">SFL <span class="text-gold">RULES</span></div>
    <div class="ml-auto flex items-center gap-2" id="divBadgeWrap" hidden>
      <span id="divBadge" class="hidden sm:inline text-xs text-white/70"></span>
      <button id="changeDiv" class="text-xs font-semibold bg-white/10 hover:bg-white/20 active:bg-white/25 border border-white/30 rounded-lg px-2.5 py-1.5 inline-flex items-center gap-1.5 transition">
        <svg class="w-3.5 h-3.5" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M7.5 21 3 16.5m0 0L7.5 12M3 16.5h13.5m3-13.5L21 7.5m0 0L16.5 12M21 7.5H7.5"/></svg>
        Change division
      </button>
    </div>
  </div>
</header>

<!-- ================= ENTRY OVERLAY ================= -->
<div id="entry" class="fixed inset-0 z-40 bg-gradient-to-b from-slate-200 to-slate-400 flex items-center justify-center p-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-[0_25px_70px_-15px_rgba(0,0,0,0.75)] ring-1 ring-slate-900/10 overflow-hidden fade-in">
    <div class="h-1.5 bg-gradient-to-r from-brand via-gold to-brand"></div>
    <div class="bg-navy-800 text-white px-6 py-7 text-center">
      <img src="https://d2jqoimos5um40.cloudfront.net/site_1296/83a31.png" alt="Southwest Football League"
           class="h-24 w-auto mx-auto mb-4 bg-white rounded-2xl p-3 shadow-md"
           onerror="this.outerHTML='&lt;svg width=76 height=90 viewBox=\'0 0 34 40\' style=\'margin:0 auto 16px;display:block\'&gt;&lt;path d=\'M17 1 L33 6 V20 C33 30 26 36 17 39 C8 36 1 30 1 20 V6 Z\' fill=\'#0B2A4A\' stroke=\'#F5A623\' stroke-width=2/&gt;&lt;text x=17 y=25 text-anchor=middle font-family=Oswald font-size=12 font-weight=700 fill=#fff&gt;SFL&lt;/text&gt;&lt;/svg&gt;'">
      <div class="font-head text-2xl font-bold">Welcome to the SFL Rulebook</div>
      <p class="text-sm text-white/80 mt-1">Pick your league to get started.</p>
    </div>
    <div class="p-6">
      <!-- Step 1: format -->
      <div id="step1">
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Step 1 — Choose format</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button data-format="flag" class="pick group border-2 border-slate-200 hover:border-brand rounded-xl p-5 text-left transition">
            <div class="font-head text-xl font-bold text-navy">Flag Football</div>
            <div class="text-sm text-slate-500 mt-1">Grades 1–6 · non-contact</div>
          </button>
          <button data-format="tackle" class="pick group border-2 border-slate-200 hover:border-brand rounded-xl p-5 text-left transition">
            <div class="font-head text-xl font-bold text-navy">Tackle Football</div>
            <div class="text-sm text-slate-500 mt-1">Grades 3–8</div>
          </button>
        </div>
      </div>
      <!-- Step 2: flag age -->
      <div id="step2" hidden>
        <button id="backStep" class="text-xs text-slate-500 hover:text-brand mb-3">&larr; Back</button>
        <div class="text-xs font-semibold uppercase tracking-wider text-slate-500 mb-3">Step 2 — Which flag division?</div>
        <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
          <button data-div="flag-freshman" class="pickdiv border-2 border-slate-200 hover:border-brand rounded-xl p-5 text-left transition">
            <div class="font-head text-xl font-bold text-navy">Freshman</div>
            <div class="text-sm text-slate-500 mt-1">1st–2nd grade · special provisions apply</div>
          </button>
          <button data-div="flag-older" class="pickdiv border-2 border-slate-200 hover:border-brand rounded-xl p-5 text-left transition">
            <div class="font-head text-xl font-bold text-navy">Older Divisions</div>
            <div class="text-sm text-slate-500 mt-1">Sophomore · Junior</div>
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ================= TABS ================= -->
<nav id="tabs" class="bg-white border-b border-slate-200 sticky top-12 z-20" hidden>
  <div class="max-w-5xl mx-auto px-2 flex">
    <button data-tab="ask"     class="tabbtn flex-1 font-head font-semibold uppercase tracking-wide text-sm py-3 text-slate-500">Ask</button>
    <button data-tab="rules"   class="tabbtn flex-1 font-head font-semibold uppercase tracking-wide text-sm py-3 text-slate-500">Rules</button>
    <button data-tab="suggest" class="tabbtn flex-1 font-head font-semibold uppercase tracking-wide text-sm py-3 text-slate-500">Suggest</button>
  </div>
</nav>

<!-- ================= MAIN ================= -->
<main class="flex-1 max-w-5xl w-full mx-auto px-4 py-5" id="main" hidden>

  <!-- ---- ASK ---- -->
  <section id="panel-ask" class="tabpanel">
    <div id="chatTop" class="flex justify-end mb-1" hidden>
      <button id="newChat" type="button" class="text-xs font-semibold text-slate-500 hover:text-brand inline-flex items-center gap-1">
        <svg class="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v14M5 12h14"/></svg>
        New chat
      </button>
    </div>
    <div id="chatScroll" class="chat-scroll flex flex-col space-y-3 overflow-y-auto pb-2" style="min-height:46vh;max-height:62vh"></div>
    <form id="chatForm" class="mt-3 flex gap-2">
      <input id="chatInput" autocomplete="off" placeholder="Ask about a rule — e.g. “Can the QB run?”"
        class="flex-1 rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/40" />
      <button id="chatSend" class="bg-brand hover:bg-brand-dark text-white font-semibold rounded-xl px-5 transition disabled:opacity-50">Send</button>
    </form>
  </section>

  <!-- ---- RULES ---- -->
  <section id="panel-rules" class="tabpanel" hidden>
    <div id="divIntro" class="mb-3"></div>
    <div class="relative mb-2">
      <input id="ruleSearch" placeholder="Search the rules…"
        class="w-full rounded-xl border border-slate-300 pl-10 pr-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/40" />
      <svg class="absolute left-3 top-3.5 w-5 h-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-4.3-4.3m1.3-5.4a6.7 6.7 0 11-13.4 0 6.7 6.7 0 0113.4 0z"/></svg>
    </div>
    <div id="searchInfo" class="text-sm text-slate-500 mb-2" hidden></div>
    <div id="rulesTOC" class="space-y-3"></div>
  </section>

  <!-- ---- SUGGEST ---- -->
  <section id="panel-suggest" class="tabpanel" hidden>
    <div class="max-w-xl">
      <h2 class="font-head text-xl font-bold text-navy mb-4">Suggest a rule</h2>
      <form id="suggestForm" class="space-y-4">
        <div>
          <label class="block text-sm font-semibold mb-1">Your name <span class="text-brand">*</span></label>
          <input name="name" required class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/40" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Email <span class="text-slate-400 font-normal">(optional, so the league can reply)</span></label>
          <input name="email" type="email" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/40" />
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Applies to <span class="text-brand">*</span></label>
          <div class="relative" id="suggestDivWrap">
            <button type="button" id="suggestDivToggle" class="w-full flex items-center justify-between gap-2 rounded-xl border border-slate-300 px-4 py-3 text-left focus:outline-none focus:ring-2 focus:ring-brand/40">
              <span id="suggestDivSummary" class="text-sm text-slate-400 truncate">Select division(s)</span>
              <svg id="suggestDivChev" class="w-4 h-4 text-slate-400 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path stroke-linecap="round" stroke-linejoin="round" d="M19 9l-7 7-7-7"/></svg>
            </button>
            <div id="suggestDivs" class="absolute z-10 mt-1 w-full bg-white border border-slate-200 rounded-xl shadow-lg p-2 space-y-0.5" hidden></div>
          </div>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Suggested rule or change <span class="text-brand">*</span></label>
          <textarea name="suggestion" required rows="4" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/40"></textarea>
        </div>
        <div>
          <label class="block text-sm font-semibold mb-1">Why? <span class="text-slate-400 font-normal">(optional)</span></label>
          <textarea name="rationale" rows="3" class="w-full rounded-xl border border-slate-300 px-4 py-3 focus:outline-none focus:ring-2 focus:ring-brand/40"></textarea>
        </div>
        <button id="suggestSend" class="bg-brand hover:bg-brand-dark text-white font-semibold rounded-xl px-6 py-3 transition disabled:opacity-50">Send suggestion</button>
        <div id="suggestMsg" class="text-sm" role="status"></div>
      </form>
    </div>
  </section>
</main>

<footer class="text-center text-xs text-slate-400 py-6">
  SFL Rules · Southwest Football League · <span id="rulesUpdated"></span>
</footer>

<!-- Floating scroll cue: only shown when the page overflows and you're not at the bottom -->
<div id="scrollHint" class="fixed left-1/2 -translate-x-1/2 bottom-4 z-20 pointer-events-none" style="opacity:0">
  <div class="bg-navy-800/90 text-white rounded-full w-9 h-9 flex items-center justify-center shadow-lg animate-bounce">
    <svg class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M19 9l-7 7-7-7"/></svg>
  </div>
</div>

<script src="/rules.js"></script>
<script>
(function () {
  const R = window.SFL_RULES;
  const $ = (s, r = document) => r.querySelector(s);
  const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
  const esc = (s) => String(s).replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

  const state = { division: null, tab: "ask", chat: [], sending: false, pendingFormat: null };
  $("#rulesUpdated").textContent = R.updated || "";

  /* ---------- ENTRY ---------- */
  $$(".pick").forEach(b => b.addEventListener("click", () => {
    const fmt = b.dataset.format;
    if (fmt === "tackle") { setDivision("tackle-sophomore"); }
    else { $("#step1").hidden = true; $("#step2").hidden = false; }
  }));
  $("#backStep").addEventListener("click", () => { $("#step2").hidden = true; $("#step1").hidden = false; });
  $$(".pickdiv").forEach(b => b.addEventListener("click", () => setDivision(b.dataset.div)));
  $("#changeDiv").addEventListener("click", () => {
    $("#entry").hidden = false; $("#step2").hidden = true; $("#step1").hidden = false;
  });

  function setDivision(id) {
    state.division = id;
    const div = R.divisions[id];
    $("#entry").hidden = true;
    $("#tabs").hidden = false; $("#main").hidden = false; $("#divBadgeWrap").hidden = false;
    $("#divBadge").textContent = div.short;
    renderSuggestDivs();
    renderRules();
    // reset chat for the new division
    state.chat = []; renderChat();
    setTab(state.tab);
  }

  /* ---------- TABS ---------- */
  $$(".tabbtn").forEach(b => b.addEventListener("click", () => setTab(b.dataset.tab)));
  function setTab(tab) {
    state.tab = tab;
    $$(".tabbtn").forEach(b => {
      const on = b.dataset.tab === tab;
      b.classList.toggle("text-navy", on); b.classList.toggle("text-slate-500", !on);
      b.classList.toggle("tab-underline", on);
    });
    $("#panel-ask").hidden = tab !== "ask";
    $("#panel-rules").hidden = tab !== "rules";
    $("#panel-suggest").hidden = tab !== "suggest";
    if (tab === "ask") setTimeout(() => $("#chatInput").focus(), 30);
    setTimeout(updateScrollHint, 0);
  }

  /* ---------- RULES LOOKUP ---------- */
  function renderRules() {
    const div = R.divisions[state.division];
    // Compact one-line title; for freshman, fold the intro + provisions into one
    // collapsed "exceptions" accordion so search + sections sit higher.
    let html = `<h2 class="font-head text-base sm:text-xl font-bold text-navy leading-snug">${esc(div.label)}</h2>`;
    if (div.provisions) {
      html += `<details class="acc mt-2 border-l-4 border-gold bg-amber-50 rounded-r-lg overflow-hidden">
        <summary class="cursor-pointer px-3 py-2 flex items-center gap-2">
          <span class="font-head font-semibold text-navy text-sm flex-1">Freshman Division exceptions</span>
          <span class="text-[11px] bg-gold/25 text-navy rounded-full px-2 py-0.5">${div.provisions.length}</span>
          <span class="chev text-navy/50 shrink-0">▾</span>
        </summary>
        <div class="px-3 pb-3">
          <p class="text-xs text-slate-600 mb-2">${esc(div.intro)}</p>
          <ul class="space-y-1 text-sm">` +
          div.provisions.map(p => `<li><span class="font-semibold text-navy">${esc(p.label)}:</span> ${esc(p.text)}</li>`).join("") +
          `</ul>
        </div>
      </details>`;
    } else {
      html += `<p class="text-sm text-slate-600 mt-1">${esc(div.intro)}</p>`;
    }
    $("#divIntro").innerHTML = html;
    renderTOC("");
  }

  function sectionHTML(sec) {
    let body;
    if (sec.rows && sec.rows.length) {
      body = `<div class="mt-2 divide-y divide-slate-100 border border-slate-200 rounded-lg overflow-hidden">` +
        sec.rows.map(r => `<div class="grid grid-cols-5 gap-2 px-3 py-2 text-sm">
            <div class="col-span-2 font-semibold text-navy">${esc(r.label)}</div>
            <div class="col-span-3 text-slate-700">${esc(r.value)}</div></div>`).join("") +
        `</div>`;
    } else {
      body = `<div class="rule-body mt-1 text-sm text-slate-700 leading-relaxed">${esc(sec.text)}</div>`;
    }
    return `<details class="rule-sec acc border border-slate-200 rounded-lg bg-white" data-title="${esc(sec.title.toLowerCase())}" data-text="${esc(sec.text.toLowerCase())}">
      <summary class="cursor-pointer px-4 py-2.5 flex items-center justify-between gap-3">
        <span class="font-head font-semibold text-navy text-sm">${esc(sec.title)}</span>
        <span class="chev text-slate-400 shrink-0">▾</span>
      </summary>
      <div class="px-4 pb-4">${body}</div>
    </details>`;
  }

  function renderTOC(q) {
    const div = R.divisions[state.division];
    const query = (q || "").trim().toLowerCase();
    let shown = 0;
    // Two-level accordion: category bars (collapsed) → sections → rule text.
    const html = div.groups.map(g => {
      const matched = g.sections.filter(s => {
        const hit = !query || s.title.toLowerCase().includes(query) || s.text.toLowerCase().includes(query);
        if (hit && query) shown++;
        return hit;
      });
      if (query && matched.length === 0) return "";
      const list = query ? matched : g.sections;
      const badge = query ? `${matched.length}/${g.sections.length}` : String(g.sections.length);
      return `<details class="rule-group acc border border-slate-200 rounded-xl bg-white overflow-hidden shadow-sm" data-group="${esc(g.title.toLowerCase())}" ${query ? "open" : ""}>
        <summary class="cursor-pointer px-4 py-3 flex items-center gap-3 bg-navy-800 text-white hover:bg-navy-700 transition">
          <span class="font-head font-semibold tracking-wide flex-1">${esc(g.title)}</span>
          <span class="text-[11px] bg-white/15 rounded-full px-2 py-0.5">${badge}</span>
          <span class="chev text-white/70 shrink-0">▾</span>
        </summary>
        <div class="p-2 space-y-2 bg-slate-50">${list.map(sectionHTML).join("")}</div>
      </details>`;
    }).join("");
    $("#rulesTOC").innerHTML = html || `<p class="text-slate-500 text-sm">No rules matched “${esc(q)}”.</p>`;
    const info = $("#searchInfo");
    if (query) {
      info.hidden = false;
      info.textContent = `${shown} section${shown === 1 ? "" : "s"} match “${q}”.`;
      $$(".rule-sec", $("#rulesTOC")).forEach(d => { d.open = true; }); // expand matched sections too
      highlight($("#rulesTOC"), query);
    } else { info.hidden = true; }
    setTimeout(updateScrollHint, 0);
  }

  function highlight(root, q) {
    const rx = new RegExp("(" + q.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")", "ig");
    $$(".rule-body, summary span, .text-slate-700", root).forEach(el => {
      if (el.children.length) return;
      el.innerHTML = el.textContent.replace(rx, "<mark>$1</mark>");
    });
  }

  let searchT;
  $("#ruleSearch").addEventListener("input", e => {
    clearTimeout(searchT);
    searchT = setTimeout(() => renderTOC(e.target.value), 120);
  });

  /* ---------- CHAT ---------- */
  const SUGGESTIONS = {
    "flag-older": ["Can the quarterback run?", "How does blitzing work?", "What is the no-run zone?", "How many points is a PAT?"],
    "flag-freshman": ["Is blitzing allowed?", "How long is the pass clock?", "Is there a no-run zone?", "What's the field width?"],
    "tackle-sophomore": ["How long are quarters?", "How do kickoffs work?", "What's the mercy rule?", "How many points is a field goal?"],
  };
  function fmt(t) {
    let s = esc(t).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>");
    // {{SECTION HEADING}} -> tappable link into the Rules tab
    s = s.replace(/\{\{\s*(.+?)\s*\}\}/g, (m, title) =>
      `<button type="button" class="cite text-brand font-semibold underline decoration-brand/40 hover:decoration-brand">${title}</button>`);
    return s.replace(/\n/g, "<br>");
  }
  // Jump from a chat citation to the matching rule in the Rules tab.
  function openRuleSection(title) {
    const t = (title || "").trim().toLowerCase();
    setTab("rules");
    const search = $("#ruleSearch"); if (search) search.value = "";
    renderTOC("");
    let target = null, cat = null;
    $$("#rulesTOC .rule-group").forEach(gd => {
      if (gd.dataset.group === t) cat = cat || gd;
      $$(".rule-sec", gd).forEach(sd => { if (sd.dataset.title === t) { target = sd; cat = gd; } });
    });
    if (cat) cat.open = true;
    if (target) target.open = true;
    setTimeout(() => {
      const el = target || cat;
      if (el) el.scrollIntoView({ behavior: "smooth", block: target ? "center" : "start" });
    }, 90);
  }
  function renderChat() {
    const box = $("#chatScroll");
    const top = $("#chatTop");
    if (!state.division) { box.innerHTML = ""; if (top) top.hidden = true; return; }
    if (!state.chat.length) {
      if (top) top.hidden = true;
      const chips = (SUGGESTIONS[state.division] || []).map(t =>
        `<button class="chip text-xs border border-slate-300 hover:border-brand hover:text-brand rounded-full px-3 py-1.5 transition">${esc(t)}</button>`).join("");
      box.innerHTML = `<div class="m-auto text-center px-4 max-w-sm">
        <div class="text-slate-500 text-sm">Ask anything about the <strong class="text-navy">${esc(R.divisions[state.division].label)}</strong> rules.</div>
        <div class="text-[11px] text-slate-400 mt-1 mb-4">AI guidance from the official rulebook — officials have the final word.</div>
        <div class="flex flex-wrap justify-center gap-2">${chips}</div>
      </div>`;
      return;
    }
    if (top) top.hidden = false;
    box.innerHTML = state.chat.map(m => {
      if (m.role === "user") {
        return `<div class="flex justify-end"><div class="bg-navy-800 text-white rounded-2xl rounded-br-sm px-4 py-2.5 max-w-[85%] text-[13px] leading-relaxed fade-in">${fmt(m.content)}</div></div>`;
      }
      const err = m.error ? " border border-amber-300" : "";
      return `<div class="flex justify-start"><div class="bg-white${err} shadow-sm rounded-2xl rounded-bl-sm px-4 py-2.5 max-w-[90%] text-[13px] leading-relaxed text-slate-800 fade-in">${m.typing ? typingDots() : fmt(m.content)}</div></div>`;
    }).join("");
    box.scrollTop = box.scrollHeight;
  }
  const typingDots = () => `<span class="inline-flex gap-1"><span class="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style="animation-delay:0ms"></span><span class="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style="animation-delay:120ms"></span><span class="w-2 h-2 bg-slate-300 rounded-full animate-bounce" style="animation-delay:240ms"></span></span>`;

  $("#chatForm").addEventListener("submit", e => { e.preventDefault(); sendChat(); });
  $("#chatScroll").addEventListener("click", e => {
    const c = e.target.closest(".cite");
    if (c) { e.preventDefault(); openRuleSection(c.textContent); return; }
    const chip = e.target.closest(".chip");
    if (chip) { $("#chatInput").value = chip.textContent; sendChat(); }
  });
  $("#newChat").addEventListener("click", () => { state.chat = []; renderChat(); $("#chatInput").focus(); });

  async function sendChat() {
    const input = $("#chatInput");
    const text = input.value.trim();
    if (!text || state.sending) return;
    input.value = "";
    state.chat.push({ role: "user", content: text });
    state.chat.push({ role: "assistant", content: "", typing: true });
    state.sending = true; $("#chatSend").disabled = true;
    renderChat();

    try {
      const res = await fetch("/api/chat", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          division: state.division,
          messages: state.chat.filter(m => !m.typing).map(m => ({ role: m.role, content: m.content })),
        }),
      });
      const data = await res.json().catch(() => ({}));
      state.chat = state.chat.filter(m => !m.typing);
      if (res.ok && data.reply) {
        state.chat.push({ role: "assistant", content: data.reply });
      } else {
        state.chat.push({ role: "assistant", error: true,
          content: data.message || "Sorry — I couldn't answer that just now. Please try again." });
      }
    } catch {
      state.chat = state.chat.filter(m => !m.typing);
      state.chat.push({ role: "assistant", error: true, content: "Network error — please check your connection and try again." });
    } finally {
      state.sending = false; $("#chatSend").disabled = false;
      renderChat();
    }
  }

  /* ---------- SUGGEST ---------- */
  function updateSuggestSummary() {
    const wrap = $("#suggestDivs"), sum = $("#suggestDivSummary");
    if (!wrap || !sum) return;
    const checked = $$(".divchk", wrap).filter(c => c.checked).map(c => c.value);
    if (!checked.length) { sum.textContent = "Select division(s)"; sum.className = "text-sm text-slate-400 truncate"; return; }
    sum.className = "text-sm text-slate-700 truncate";
    sum.textContent = checked.includes("all")
      ? "All divisions (universal rule)"
      : checked.map(v => R.divisions[v].short).join(", ");
  }
  function renderSuggestDivs() {
    const wrap = $("#suggestDivs");
    if (!wrap) return;
    const opts = [{ v: "all", label: "All divisions (universal rule)" }]
      .concat(R.order.map(id => ({ v: id, label: R.divisions[id].short })));
    wrap.innerHTML = opts.map(o =>
      `<label class="flex items-center gap-2 text-sm text-slate-700 cursor-pointer px-2 py-1.5 rounded-lg hover:bg-slate-50">
         <input type="checkbox" class="divchk w-4 h-4 accent-brand" value="${o.v}" ${o.v === state.division ? "checked" : ""}>
         ${esc(o.label)}
       </label>`).join("");
    $$(".divchk", wrap).forEach(cb => cb.addEventListener("change", () => {
      if (cb.value === "all" && cb.checked) {
        $$(".divchk", wrap).forEach(o => { if (o.value !== "all") o.checked = false; });
      } else if (cb.value !== "all" && cb.checked) {
        const all = wrap.querySelector('.divchk[value="all"]'); if (all) all.checked = false;
      }
      updateSuggestSummary();
    }));
    updateSuggestSummary();
  }
  // Dropdown open/close (wired once).
  $("#suggestDivToggle").addEventListener("click", () => {
    const menu = $("#suggestDivs"); menu.hidden = !menu.hidden;
    $("#suggestDivChev").style.transform = menu.hidden ? "" : "rotate(180deg)";
  });
  document.addEventListener("click", e => {
    const wrap = $("#suggestDivWrap"), menu = $("#suggestDivs");
    if (menu && wrap && !menu.hidden && !wrap.contains(e.target)) {
      menu.hidden = true; $("#suggestDivChev").style.transform = "";
    }
  });

  $("#suggestForm").addEventListener("submit", async e => {
    e.preventDefault();
    const btn = $("#suggestSend"), msg = $("#suggestMsg");
    const f = e.target;
    const checked = $$("#suggestDivs .divchk").filter(c => c.checked).map(c => c.value);
    if (!checked.length) { msg.className = "text-sm text-amber-700"; msg.textContent = "Please choose at least one division (or All)."; return; }
    const divisionLabel = checked.includes("all")
      ? "All divisions (universal rule)"
      : checked.map(v => R.divisions[v].short).join(", ");
    btn.disabled = true; msg.className = "text-sm text-slate-500"; msg.textContent = "Sending…";
    try {
      const res = await fetch("/api/suggest", {
        method: "POST", headers: { "content-type": "application/json" },
        body: JSON.stringify({
          name: f.name.value, email: f.email.value,
          division: divisionLabel, suggestion: f.suggestion.value, rationale: f.rationale.value,
        }),
      });
      const data = await res.json().catch(() => ({}));
      if (res.ok && data.ok) {
        msg.className = "text-sm text-green-700 font-medium";
        msg.textContent = "✓ Thanks! Your suggestion was sent to the league.";
        f.reset(); renderSuggestDivs();
      } else {
        msg.className = "text-sm text-amber-700";
        msg.textContent = data.message || "Couldn't send right now. Please try again.";
      }
    } catch {
      msg.className = "text-sm text-amber-700";
      msg.textContent = "Network error — please try again.";
    } finally { btn.disabled = false; }
  });

  // Floating scroll cue: visible only on the rules tab when the page actually
  // overflows and we're not already near the bottom.
  function updateScrollHint() {
    const h = $("#scrollHint");
    if (!h) return;
    const doc = document.documentElement;
    const canScroll = doc.scrollHeight - window.innerHeight > 24;
    const atBottom = window.scrollY + window.innerHeight >= doc.scrollHeight - 24;
    h.style.opacity = (state.tab === "rules" && canScroll && !atBottom) ? "1" : "0";
  }
  window.addEventListener("scroll", updateScrollHint, { passive: true });
  window.addEventListener("resize", updateScrollHint);
  document.addEventListener("toggle", updateScrollHint, true); // any accordion open/close changes height

  // initial
  renderChat();

  // Deep-link support: ?division=flag-freshman|flag-older|tackle-sophomore&tab=ask|rules|suggest
  try {
    const params = new URLSearchParams(location.search);
    const d = params.get("division");
    if (d && R.divisions[d]) {
      const t = params.get("tab");
      if (["ask", "rules", "suggest"].includes(t)) state.tab = t;
      setDivision(d);
    }
  } catch (e) { /* ignore */ }
})();
</script>
</body>
</html>
